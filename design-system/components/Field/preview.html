<!-- @dsCard group="Forms" height=330 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<div class="page g-paper" style="padding:28px var(--pad-fluid)">
  <div class="form-grid">
    <div class="field"><label class="label" for="f-company">Company name<span class="req"> *</span></label><div class="control"><input id="f-company" type="text" placeholder="Hadi Express Exchange"></div></div>
    <div class="field is-invalid"><label class="label" for="f-email">Contact email<span class="req"> *</span></label><div class="control"><input id="f-email" type="email" value="arun.henry@hadi"></div><span class="field-error">Enter a complete email address, like name@company.com.</span></div>
    <div class="field"><label class="label" for="f-country">Country<span class="req"> *</span></label><div class="control is-select"><select id="f-country"><option>India</option><option>Singapore</option><option>United Arab Emirates</option></select></div></div>
    <div class="field"><label class="label" for="f-state">State<span class="req"> *</span></label><div class="control is-select"><select id="f-state"><option>Select a State</option><option>Tamil Nadu</option></select></div></div>
    <div class="field span-2"><label class="label" for="f-comment">Comment</label><div class="control"><textarea id="f-comment" placeholder="Tell us about your estate: endpoints, sites, regulations."></textarea></div></div>
    <div class="consent span-2">
      <label class="check"><input id="f-all" type="checkbox"> Select all</label>
      <label class="check"><input id="f-consent" type="checkbox" checked> I agree to the collection and processing of my personal data for the stated purpose<span class="req"> *</span></label>
      <label class="check"><input id="f-updates" type="checkbox"> I would like to receive updates from K7 CyberSecurity</label>
    </div>
  </div>
</div>

<!-- @dsCard height=320 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<!--
  blocks: three tabs, signal, ink and panel, 216 wide (tab-w), their right edges descending left at 24.5°, the stroke of the 7 (seven, seven-run)
  arrangement: a staggered stack stepping right to left down the cover, the S1 tab walk: together the three blocks draw the 7's diagonal; the top block bleeds off the top edge, the bottom one off the bottom
  pattern: "a literal motif → that silhouette": PT2 seven hatch, 20px pitch, one stroke at 24.5°, cut from the ink block in paper (the ground); chosen because the diagonal of the 7 is the one angle the whole language is built from
  scales: steps 216 (tab-w), 120 (3·tab-h), 40 (tab-h); the runs are height × 0.4557; radius-0 everywhere
-->
<div style="position:relative;width:960px;height:320px;background:var(--paper);color:var(--ink);font-family:var(--font-sans);overflow:hidden">
  <svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true" style="position:absolute;inset:0">
    <style>
      .sig{fill:var(--signal)} .inkb{fill:var(--ink)} .pan{fill:var(--panel)} .hatch{stroke:var(--paper);stroke-width:1;fill:none}
    </style>
    <defs>
      <pattern id="seven" width="20" height="20" patternUnits="userSpaceOnUse"><path class="hatch" d="M5.44 20L14.56 0"/></pattern>
      <clipPath id="inkclip"><path d="M612 100h216l-54.7 120H612z"/></clipPath>
    </defs>
    <path class="sig" d="M744 -40h216l-72.9 160H744z"/>
    <path class="inkb" d="M612 100h216l-54.7 120H612z"/>
    <rect x="612" y="100" width="216" height="120" fill="url(#seven)" clip-path="url(#inkclip)"/>
    <path class="pan" d="M480 200h216l-72.9 160H480z"/>
  </svg>
  <div style="position:absolute;left:40px;bottom:40px;max-width:440px">
    <div style="font-size:80px;line-height:.95;font-weight:600;letter-spacing:-.05em">K7 Design<br>Language</div>
    <div style="margin-top:12px;font-size:14px;line-height:1.3;color:var(--muted)">A case file. Version 2.2: the tab on the 7, filed containers, the record rail.</div>
  </div>
</div>
